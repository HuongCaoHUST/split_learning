version: '3'

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq_config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    container_name: split_learning_server
    build:
      context: . 
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
        
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "server.py", "--config", "./config.yaml"]

  client_2:
    container_name: split_learning_client_2
    image: split_learning-server
    depends_on:
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_started
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "client.py", "--layer_id", "2", "--docker"]

  client_1:
    image: split_learning-server
    depends_on:
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_started
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "client.py", "--layer_id", "1", "--docker"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

volumes:
  rabbitmq_data:
    driver: local