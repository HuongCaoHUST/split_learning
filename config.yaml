name: Split Learning
server:
  num-round: 1
  clients:
    - 2
    - 1

rabbit:
  address: 172.18.0.2
  username: user
  password: password

model:
  model_path: ./yolo11n.pt
  cut_layer: 
    - 10
    - 5
  hybrid_training: False
  valid_epoch_model: False
  output_model: ./merged_model.pt

dataset:
  dataset_path:
    - ./datasets/livingroom_4_1.yaml
    - ./datasets/livingroom_2.yaml
  concatenate_datasets: False

log_path: .

learning:
  learning-rate: 0.0001
  epochs: 1
  momentum: 0.5
  batch-size: 16
  control-count: 3
