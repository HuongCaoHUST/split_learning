name: Split Learning
server:
  num-round: 1
  clients:
    - 2
    - 1

rabbit:
  address: 172.18.0.2
  username: user
  password: password

model:
  task: detect
  model_path:
    - ./yolo11s.pt
    - ./yolo11s.pt
  cut_layer: 
    - 10
    - 10
  hybrid_training: False
  valid_epoch_model: False
  output_model: ./merged_model.pt

dataset:
  dataset_path:
    - ./datasets/livingroom_4_1.yaml
    - ./datasets/livingroom_4_2.yaml
  concatenate_datasets: False
  iid_datasets: False

log_path: .

learning:
  learning-rate: 0.0001
  epochs: 50
  momentum: 0.5
  batch-size: 8
  control-count: 3
  worker: 8
