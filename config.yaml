name: Split Learning
server:
  num-round: 1
  clients:
    - 4
    - 1

rabbit:
  address: 172.18.0.2
  username: user
  password: password

model:
  model_path: ./yolo11n.pt
  task: SEGMENT
  cut_layer: 
    - 5
    - 5
    - 5
    - 5
  hybrid_training: False
  valid_epoch_model: False
  output_model: ./merged_model.pt

dataset:
  dataset_path:
    - ./datasets/cifar10_yolo_cls_dirichlet_a0_3_K10/client_0
    - ./datasets/cifar10_yolo_cls_dirichlet_a0_3_K10/client_1
    - ./datasets/cifar10_yolo_cls_dirichlet_a0_3_K10/client_2
    - ./datasets/cifar10_yolo_cls_dirichlet_a0_3_K10/client_3
  concatenate_datasets: False

log_path: .

learning:
  learning-rate: 0.0001
  epochs: 10
  momentum: 0.5
  batch-size: 16
  control-count: 3
